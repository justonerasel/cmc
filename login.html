<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community Gate - CMC</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="flex items-center justify-center min-h-screen">
  <div class="gate-card">
    <a href="index.html" class="brand mb-4 justify-center">
      <div class="brand-badge">CMC</div>
      <div class="brand-text">
        <span class="brand-title">CYBER MUSLIM COMMUNITY</span>
        <span class="brand-sub">MEMBER AUTHENTICATION GATE</span>
      </div>
    </a>
    <h2>Enter Credentials</h2>
    <p>Sign in to unlock private media downloads, community whitepapers, and files.</p>
    
    <form id="login-form" class="cyber-form mt-4">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="login-email" placeholder="member@cmc.community" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-pass" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-emerald w-full">Authenticate</button>
    </form>
    <div class="mt-4 text-center">
      <a href="index.html" class="text-muted hover:underline text-sm">&larr; Return to Homepage</a>
    </div>
  </div>
  <div id="toast" class="toast hidden"></div>
  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
